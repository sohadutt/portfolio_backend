services:
  # 1. Combined Django App & Celery Worker
  - type: web
    name: django-celery-app
    region: ohio
    plan: free
    runtime: python
    # Install uv, then use uv sync to install dependencies from your uv.lock
    buildCommand: "pip install uv && uv sync --frozen"
    # Execute the custom bash script
    startCommand: "bash ./start.sh"
    autoDeploy: false
    envVars:
      - key: CELERY_BROKER_URL
        fromService:
          name: celery-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: celery-redis
          type: redis
          property: connectionString
      # Render might default to an older Python. Your lockfile requires >=3.14.
      # Make sure to set the correct Python version environment variable.
      - key: PYTHON_VERSION
        value: 3.14.0 

  # 2. Redis Broker
  - type: redis
    name: celery-redis
    region: ohio
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: [] # Blank array allows internal access from your Render services
